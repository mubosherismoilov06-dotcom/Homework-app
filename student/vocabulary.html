<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary Homework</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b1120">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://wotrxllrtwgegavdudbe.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="/js/pwa-register.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/student/nav.js"></script>
</head>
<body>
<div class="wrap">
  <h1 id="title">Loading…</h1>
  <div class="card">
    <p id="instructions"></p>
  </div>

  <div class="card">
    <h2 style="margin-top:0;">Upload Photos</h2>
    <p style="color:#666; font-size:14px; margin-top:-8px;">Take photos of the vocabulary work you've completed, or choose existing ones from your gallery/files. You can select multiple photos if you have more than one page (up to 10).</p>
    <div style="display:flex; gap:8px;">
      <button type="button" onclick="document.getElementById('photosCam').click()" style="flex:1; width:auto; margin-top:0;">📷 Take Photo</button>
      <button type="button" class="secondary" onclick="document.getElementById('photosGallery').click()" style="flex:1; width:auto; margin-top:0;">🖼️ Gallery / Files</button>
    </div>
    <input type="file" id="photosCam" accept="image/*" capture="environment" multiple style="display:none">
    <input type="file" id="photosGallery" accept="image/*" multiple style="display:none">
    <div id="stagedThumbs" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;"></div>
    <button onclick="submitPhotos()" id="submitPhotosBtn" style="margin-top:12px;" disabled>Submit Photos</button>
    <div class="error" id="photoErr"></div>
    <div class="success" id="photoOk"></div>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const hwId = params.get('id');
let profile, hw;
let staged = []; // { id, file, url } photos picked but not yet submitted

function handleFilePick(fileList) {
  Array.from(fileList).forEach(file => {
    if (staged.length >= 10) return;
    staged.push({ id: crypto.randomUUID(), file, url: URL.createObjectURL(file) });
  });
  renderStaged();
}

function renderStaged() {
  const el = document.getElementById('stagedThumbs');
  el.innerHTML = '';
  staged.forEach(item => {
    const box = document.createElement('div');
    box.style.cssText = 'position:relative; width:80px; height:80px;';
    box.innerHTML = `
      <img src="${item.url}" style="width:80px; height:80px; object-fit:cover; border-radius:6px; border:1px solid #e5e7eb;">
      <button type="button" onclick="removeStaged('${item.id}')" title="Remove"
        style="position:absolute; top:-6px; right:-6px; width:22px; height:22px; margin:0; padding:0;
        border-radius:50%; background:#dc2626; color:#fff; border:2px solid #fff; font-size:13px; line-height:1;">×</button>`;
    el.appendChild(box);
  });
  document.getElementById('submitPhotosBtn').disabled = staged.length === 0;
}

function removeStaged(id) {
  const item = staged.find(s => s.id === id);
  if (item) URL.revokeObjectURL(item.url);
  staged = staged.filter(s => s.id !== id);
  renderStaged();
}

async function load() {
  const { data } = await sb.from('homework').select('*').eq('id', hwId).single();
  hw = data;
  document.title = hw.title;
  document.getElementById('title').textContent = '📚 ' + hw.title;
  document.getElementById('instructions').textContent = hw.instructions || '';

  const { data: photoSub } = await sb.from('submissions').select('*')
    .eq('homework_id', hwId).eq('student_id', profile.id).eq('type', 'photo').maybeSingle();
  if (photoSub) {
    document.getElementById('photoOk').textContent = `✓ ${photoSub.file_path.split(',').length} photo(s) already submitted. Submitting again will replace them.`;
  }
}

document.getElementById('photosCam').addEventListener('change', e => { handleFilePick(e.target.files); e.target.value = ''; });
document.getElementById('photosGallery').addEventListener('change', e => { handleFilePick(e.target.files); e.target.value = ''; });

async function submitPhotos() {
  const errEl = document.getElementById('photoErr'), okEl = document.getElementById('photoOk');
  errEl.textContent = '';
  const files = staged.map(s => s.file);
  if (files.length === 0) { errEl.textContent = 'Please choose at least one photo.'; return; }

  document.getElementById('submitPhotosBtn').disabled = true;
  const stamp = Date.now(); // unique per submission, so a resubmit never needs
                             // to overwrite an old path (avoids depending on
                             // the storage UPDATE policy being in place)
  const paths = [];
  try {
    for (let i = 0; i < files.length; i++) {
      const ext = (files[i].name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${profile.id}/${hwId}-vocab-${stamp}-${i + 1}.${ext}`;
      const { error: upErr } = await sb.storage.from('submissions').upload(path, files[i]);
      if (upErr) throw upErr;
      paths.push(path);
    }
  } catch (upErr) {
    errEl.textContent = `Upload failed (${upErr.message || 'connection issue'}) — please try again.`;
    document.getElementById('submitPhotosBtn').disabled = false;
    return;
  }

  const { data: existing } = await sb.from('submissions').select('id')
    .eq('homework_id', hwId).eq('student_id', profile.id).eq('type', 'photo').maybeSingle();
  const result = existing
    ? await sb.from('submissions').update({ file_path: paths.join(','), submitted_at: new Date().toISOString() }).eq('id', existing.id)
    : await sb.from('submissions').insert({ homework_id: hwId, student_id: profile.id, type: 'photo', file_path: paths.join(',') });
  document.getElementById('submitPhotosBtn').disabled = false;
  if (result.error) {
    errEl.textContent = `Your photos uploaded but saving the submission failed: ${result.error.message}. Please try Submit again.`;
    return;
  }
  staged.forEach(s => URL.revokeObjectURL(s.url));
  staged = [];
  document.getElementById('stagedThumbs').innerHTML = '';
  okEl.textContent = `✓ ${paths.length} photo(s) submitted!`;
}

(async () => {
  profile = await requireStudent();
  if (!profile) return;
  renderStudentNav('My Homework');
  load();
})();
</script>
</body>
</html>
